plugins {
    id 'com.android.application'
}

// Keep compilation and local JVM tests on the project's JDK version.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Machine-local keys override checked-in placeholders.
def localConfig = new Properties()
def localConfigFile = rootProject.file('local.properties')
if (localConfigFile.exists()) {
    localConfigFile.withInputStream { localConfig.load(it) }
}
def apiKey = { String name ->
    localConfig.getProperty(name, project.findProperty(name)?.toString() ?: '')
}

android {
    namespace "edu.uiuc.weatherlens"
    compileSdk 32

    defaultConfig {
        applicationId "edu.uiuc.weatherlens"
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [mapsApiKey: apiKey('MAPS_API_KEY')]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "GEMINI_KEY", groovy.json.JsonOutput.toJson(apiKey('GEMINI_KEY'))
        buildConfigField "String", "MAPS_API_KEY", groovy.json.JsonOutput.toJson(apiKey('MAPS_API_KEY'))
        buildConfigField "String", "WEATHER_API_KEY", groovy.json.JsonOutput.toJson(apiKey('WEATHER_API_KEY'))
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.navigation:navigation-fragment:2.3.5'
    implementation 'androidx.navigation:navigation-ui:2.3.5'
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test:core:1.4.0'
    // Keep Espresso artifacts aligned to the same version to avoid runtime Dagger/reflection issues
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.6.1'
    // UI Automator can help with input/event injection compatibility on some emulator/device images
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'
}
